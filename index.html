<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İntellektual Turnir Şousu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 650px; padding: 30px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); text-align: center; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; margin-bottom: 25px; font-size: 1rem; }
        button { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: transform 0.2s, background 0.2s; width: 100%; margin-top: 10px; }
        button:hover { transform: translateY(-2px); background: linear-gradient(135deg, #7dd3fc, #1d4ed8); }
        .secondary-btn { background: #334155; }
        .secondary-btn:hover { background: #475569; }
        input, select { width: 100%; padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        input:focus, select:focus { border-color: #38bdf8; }
        .player-tag { display: inline-flex; align-items: center; background: #334155; padding: 6px 14px; border-radius: 20px; margin: 5px; font-size: 0.9rem; gap: 8px; }
        .player-tag span { cursor: pointer; color: #f43f5e; font-weight: bold; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1qrem; font-weight: bold; color: #38bdf8; background: #1e293b; padding: 10px 15px; border-radius: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .option-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 1rem; text-align: left; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { background: #334155; border-color: #38bdf8; }
        .lifelines { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .lifeline-btn { background: #f59e0b; color: #000; font-weight: bold; padding: 8px 16px; width: auto; margin: 0; }
        .lifeline-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; }
        #question-box { font-size: 1.25rem; line-height: 1.5; margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ƏSAS MENYU -->
        <div id="main-menu">
            <h1>🏆 İntellektual Şou</h1>
            <p>Öz iştirakçılarınızı daxil edin və 6 turluq möhtəşəm mübarizəyə başlayın!</p>
            <button onclick="goToSetup()">🚀 Oyunu Başlat</button>
        </div>

        <!-- 2. İŞTİRAKÇI VƏ AYARLAR EKRANI -->
        <div id="setup-screen" style="display: none;">
            <h2>İştirakçıları Qeydiyyatdan Keçir</h2>
            <p>İstədiyin qədər oyunçu əlavə edə bilərsən.</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="player-name-input" placeholder="Oyunçunun adı (məs: Əli)">
                <button onclick="addPlayer()" style="width: 120px; margin-top: 0;">Əlavə et</button>
            </div>
            <div id="players-list" style="margin: 15px 0; min-height: 50px; text-align: left;"></div>
            
            <label style="text-align: left; display: block; color: #94a3b8; font-size: 0.9rem; margin-bottom: 5px;">Hər oyunçuya düşəcək sual sayı:</label>
            <select id="questions-per-player">
                <option value="1">1 Sual</option>
                <option value="2" selected>2 Sual</option>
                <option value="3">3 Sual</option>
            </select>

            <button onclick="startTournament()" style="margin-top: 20px;">🎮 Turniri Başlat</button>
            <button class="secondary-btn" onclick="goHome()" style="margin-top: 10px;">Geri</button>
        </div>

        <!-- 3. OYUN EKRANI -->
        <div id="game-screen" style="display: none;">
            <div class="game-header">
                <span id="current-round-text">Tur: 1 / 6</span>
                <span id="current-player-text">Oyunçu: Əli</span>
                <span id="timer-text">⏱️ 5s</span>
            </div>

            <div class="lifelines">
                <button class="lifeline-btn" id="lifeline-50" onclick="useFiftyFifty()">💡 50/50</button>
                <button class="lifeline-btn" id="lifeline-audience" onclick="useAudience()">📊 Auditoriya</button>
            </div>

            <div id="question-box">Sual yüklənir...</div>

            <div class="options-grid" id="options-container">
                <button class="option-btn" onclick="checkAnswer(0)">Seçim 1</button>
                <button class="option-btn" onclick="checkAnswer(1)">Seçim 2</button>
                <button class="option-btn" onclick="checkAnswer(2)">Seçim 3</button>
                <button class="option-btn" onclick="checkAnswer(3)">Seçim 4</button>
            </div>

            <p id="status-msg" style="margin-top: 15px; font-weight: bold; min-height: 24px;"></p>
        </div>

        <!-- 4. NƏTİCƏ / FİNAL EKRANI -->
        <div id="result-screen" style="display: none;">
            <h2 id="result-title">Tur Nəticələri</h2>
            <div id="scoreboard-list" style="margin: 20px 0; text-align: left;"></div>
            <button id="next-action-btn" onclick="nextRoundOrFinish()">Növbəti Tur</button>
        </div>
    </div>

    <script>
        let players = [];
        let currentRound = 1;
        let currentPlayerIndex = 0;
        let currentQuestionIndex = 0;
        let qPerPlayer = 2;
        let timer;
        let timeLeft = 5;
        let isReadingPhase = true;
        let fiftyFiftyUsed = false;
        let audienceUsed = false;

        const allQuestions = [
            { q: "Azərbaycan Demokratik Respublikası hansı ildə yaradılmışdır?", options: ["1918", "1920", "1991", "1936"], correct: 0 },
            { q: "Dünyanın ən böyük okeanı hansıdır?", options: ["Atlantik", "Hind", "Şaxtalı Buzlu", "Sakit"], correct: 3 },
            { q: "9-un kvadratı ədədi nəyə bərabərdir?", options: ["72", "81", "18", "99"], correct: 1 },
            { q: "Çempionlar Liqasını ən çox qazanan klub hansıdır?", options: ["Barcelona", "AC Milan", "Real Madrid", "Manchester United"], correct: 2 },
            { q: "Azərbaycanın ən uzun çayı hansıdır?", options: ["Kür", "Araz", "Samur", "Qanıx"], correct: 0 },
            { q: "Üçbucağın daxili bucaqlarının cəmi neçə dərəcədir?", options: ["90°", "180°", "360°", "270°"], correct: 1 },
            { q: "Şah İsmayıl Xatai hansı sülalənin banisidir?", options: ["Şirvanşahlar", "Səfəvilər", "Qacarlar", "Atabəylər"], correct: 1 },
            { q: "Xəzər dənizi coğrafi cəhətdən əslində nə hesab olunur?", options: ["Okean", "Açıq dəniz", "Dünyanın ən böyük gölü", "Körfəz"], correct: 2 }
        ];

        function goToSetup() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }

        function goHome() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }

        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if(name && !players.some(p => p.name === name)) {
                players.push({ name: name, score: 0, activeInTournament: true });
                input.value = '';
                renderPlayersList();
            }
        }

        function removePlayer(name) {
            players = players.filter(p => p.name !== name);
            renderPlayersList();
        }

        function renderPlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = players.map(p => `<div class="player-tag">${p.name} <span onclick="removePlayer('${p.name}')">✕</span></div>`).join('');
        }

        function startTournament() {
            if(players.length < 2) {
                alert("Ən azı 2 iştirakçı əlavə etməlisən!");
                return;
            }
            qPerPlayer = parseInt(document.getElementById('questions-per-player').value);
            currentRound = 1;
            fiftyFiftyUsed = false;
            audienceUsed = false;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startRound();
        }

        function startRound() {
            currentPlayerIndex = 0;
            currentQuestionIndex = 0;
            loadTurn();
        }

        function loadTurn() {
            const activePlayers = players.filter(p => p.activeInTournament);
            if(currentPlayerIndex >= activePlayers.length) {
                showRoundResults();
                return;
            }

            const currentPlayer = activePlayers[currentPlayerIndex];
            document.getElementById('current-round-text').innerText = `Tur: ${currentRound} / 6`;
            document.getElementById('current-player-text').innerText = `Növbə: ${currentPlayer.name}`;
            
            // Reset lifelines per turn or keep globally? User said: "50/50 ancaq 1 dəfə istifadə etdikdən sonra bitsin"
            document.getElementById('lifeline-50').disabled = fiftyFiftyUsed;
            document.getElementById('lifeline-audience').disabled = audienceUsed;

            isReadingPhase = true;
            timeLeft = 5;
            document.getElementById('timer-text').innerText = `⏱️ Oxumaq üçün: ${timeLeft}s`;
            document.getElementById('question-box').innerText = `${currentPlayer.name}, növbəti suala hazırlaş! Sual gəlir...`;
            
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => {
                b.style.display = 'block';
                b.style.opacity = '0.3';
                b.disabled = true;
            });
            document.getElementById('status-msg').innerText = "Sual oxunur...";

            timer = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) {
                    document.getElementById('timer-text').innerText = `⏱️ Oxumaq üçün: ${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    beginAnsweringPhase();
                }
            }, 1000);
        }

        function beginAnsweringPhase() {
            isReadingPhase = false;
            timeLeft = 15;
            document.getElementById('timer-text').innerText = `⏱️ Cavab: ${timeLeft}s`;
            
            // Pick a random question
            window.currentQ = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            document.getElementById('question-box').innerText = window.currentQ.q;

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach((btn, idx) => {
                btn.style.opacity = '1';
                btn.disabled = false;
                btn.style.backgroundColor = '#1e293b';
                btn.innerText = window.currentQ.options[idx];
            });
            document.getElementById('status-msg').innerText = "";

            timer = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) {
                    document.getElementById('timer-text').innerText = `⏱️ Cavab: ${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    handleAnswer(-1); // Time out
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            if(isReadingPhase) return;
            clearInterval(timer);
            handleAnswer(selectedIndex);
        }

        function handleAnswer(selectedIndex) {
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => b.disabled = true);

            const activePlayers = players.filter(p => p.activeInTournament);
            const currentPlayer = activePlayers[currentPlayerIndex];

            if(selectedIndex === window.currentQ.correct) {
                optionBtns[selectedIndex].style.backgroundColor = '#10b981';
                currentPlayer.score += 10;
                document.getElementById('status-msg').innerText = "🎉 Düzdür! (+10 xal)";
                document.getElementById('status-msg').style.color = '#10b981';
            } else {
                if(selectedIndex !== -1) {
                    optionBtns[selectedIndex].style.backgroundColor = '#ef4444';
                }
                optionBtns[window.currentQ.correct].style.backgroundColor = '#10b981';
                document.getElementById('status-msg').innerText = "❌ Səhvdir!";
                document.getElementById('status-msg').style.color = '#ef4444';
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if(currentQuestionIndex < qPerPlayer) {
                    loadTurn();
                } else {
                    currentPlayerIndex++;
                    currentQuestionIndex = 0;
                    loadTurn();
                }
            }, 2000);
        }

        function useFiftyFifty() {
            if(fiftyFiftyUsed || isReadingPhase) return;
            fiftyFiftyUsed = true;
            document.getElementById('lifeline-50').disabled = true;

            const correct = window.currentQ.correct;
            let hiddenCount = 0;
            const optionBtns = document.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, idx) => {
                if(idx !== correct && hiddenCount < 2) {
                    btn.style.opacity = '0.1';
                    btn.disabled = true;
                    hiddenCount++;
                }
            });
        }

        function useAudience() {
            if(audienceUsed || isReadingPhase) return;
            audienceUsed = true;
            document.getElementById('lifeline-audience').disabled = true;

            const correct = window.currentQ.correct;
            let percentages = [10, 15, 20, 55];
            // shuffle or assign high to correct
            alert(`📊 Auditoriyanın səsləri:\nA variantı: 15%\nB variantı: 20%\nC variantı: 10%\nD variantı: 55%\n(Auditoriya əmin görünür!)`);
        }

        function showRoundResults() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const sorted = [...players].sort((a,b) => b.score - a.score);
            document.getElementById('result-title').innerText = `${currentRound}-ci Turun Nəticələri`;
            
            const list = document.getElementById('scoreboard-list');
            list.innerHTML = sorted.map((p, idx) => `<div style="padding: 8px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between;"><span>#${idx+1} ${p.name}</span> <span><b>${p.score} xal</b></span></div>`).join('');

            const nextBtn = document.getElementById('next-action-btn');
            if(currentRound === 5) {
                nextBtn.innerText = "🏆 6-cı Tur (Böyük Finala Keç)";
            } else if(currentRound >= 6) {
                nextBtn.innerText = "🎯 Oyunu Bitir / Yenidən Başla";
            } else {
                nextBtn.innerText = "➡️ Növbəti Tura Keç";
            }
        }

        function nextRoundOrFinish() {
            if(currentRound >= 6) {
                location.reload();
                return;
            }

            if(currentRound === 5) {
                // 5-ci tur sonunda ən yaxşılar qalır (məsələn, top oyunçular)
                players.sort((a,b) => b.score - a.score);
                if(players.length > 5) {
                    players = players.slice(0, 5); // 5 qalib 6-cı turda yarışır
                }
                alert("Möhtəşəm! Ən yaxşı oyunçular 6-cı tur Finalına vəsiqə qazandılar!");
            }

            currentRound++;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startRound();
        }
    </script>
</body>
</html>
