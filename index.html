<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İntellektual Turnir Şousu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 2px solid rgba(56, 189, 248, 0.2); width: 100%; max-width: 680px; padding: 35px; border-radius: 24px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.15), 0 25px 50px -12px rgba(0, 0, 0, 0.8); text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #38bdf8, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(56, 189, 248, 0.3); }
        p { color: #94a3b8; margin-bottom: 25px; font-size: 1rem; }
        button { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; border: none; padding: 14px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: transform 0.2s, box-shadow 0.2s; width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6); }
        .secondary-btn { background: #334155; box-shadow: none; }
        .secondary-btn:hover { background: #475569; box-shadow: none; }
        input, select { width: 100%; padding: 14px 18px; background: #020617; border: 1px solid #334155; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .player-tag { display: inline-flex; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; margin: 6px; font-size: 0.95rem; gap: 10px; }
        .player-tag span { cursor: pointer; color: #f43f5e; font-weight: bold; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1rem; font-weight: bold; color: #38bdf8; background: #020617; padding: 12px 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option-btn { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #334155; color: #fff; padding: 18px; border-radius: 12px; cursor: pointer; font-size: 1.05rem; text-align: left; transition: 0.2s; box-shadow: none; }
        .option-btn:hover:not(:disabled) { border-color: #38bdf8; background: #1e293b; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); }
        .lifelines { display: flex; gap: 12px; margin-top: 15px; justify-content: center; }
        .lifeline-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: bold; padding: 10px 20px; width: auto; margin: 0; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .lifeline-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }
        #question-box { font-size: 1.35rem; line-height: 1.5; margin: 20px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; background: #020617; padding: 25px; border-radius: 16px; border: 2px solid #1e293b; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ƏSAS MENYU -->
        <div id="main-menu">
            <h1>🏆 İntellektual Şou</h1>
            <p>İştirakçıları daxil et, 25 saniyəlik həyəcan dolu turlara başla!</p>
            <button onclick="goToSetup()">🚀 Oyunu Başlat</button>
        </div>

        <!-- 2. İŞTİRAKÇI VƏ AYARLAR EKRANI -->
        <div id="setup-screen" style="display: none;">
            <h2>İştirakçıları Qeydiyyatdan Keçir</h2>
            <p>İstədiyin qədər oyunçu əlavə edə bilərsən.</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="player-name-input" placeholder="Oyunçunun adı (məs: Əli)">
                <button onclick="addPlayer()" style="width: 130px; margin-top: 0;">Əlavə et</button>
            </div>
            <div id="players-list" style="margin: 15px 0; min-height: 60px; text-align: left;"></div>
            
            <label style="text-align: left; display: block; color: #94a3b8; font-size: 0.9rem; margin-bottom: 5px;">Hər oyunçuya düşəcək sual sayı:</label>
            <select id="questions-per-player">
                <option value="1">1 Sual</option>
                <option value="2" selected>2 Sual</option>
                <option value="3">3 Sual</option>
            </select>

            <button onclick="startTournament()" style="margin-top: 20px;">🎮 Turniri Başlat</button>
            <button class="secondary-btn" onclick="goHome()" style="margin-top: 10px;">Geri</button>
        </div>

        <!-- 3. OYUN EKRANI -->
        <div id="game-screen" style="display: none;">
            <div class="game-header">
                <span id="current-round-text">Tur: 1 / 6</span>
                <span id="current-player-text">Oyunçu: Əli</span>
                <span id="timer-text" style="color: #f59e0b;">⏱️ 25s</span>
            </div>

            <div class="lifelines">
                <button class="lifeline-btn" id="lifeline-50" onclick="useFiftyFifty()">💡 50/50</button>
                <button class="lifeline-btn" id="lifeline-audience" onclick="useAudience()">📊 Auditoriya</button>
            </div>

            <div id="question-box">Sual yüklənir...</div>

            <div class="options-grid" id="options-container">
                <button class="option-btn" onclick="checkAnswer(0)">Seçim 1</button>
                <button class="option-btn" onclick="checkAnswer(1)">Seçim 2</button>
                <button class="option-btn" onclick="checkAnswer(2)">Seçim 3</button>
                <button class="option-btn" onclick="checkAnswer(3)">Seçim 4</button>
            </div>

            <p id="status-msg" style="margin-top: 15px; font-weight: bold; min-height: 24px;"></p>
            
            <button class="secondary-btn" onclick="goHome()" style="margin-top: 15px;">❌ Əsas Menyuya Qayıt</button>
        </div>

        <!-- 4. NƏTİCƏ / FİNAL EKRANI -->
        <div id="result-screen" style="display: none;">
            <h2 id="result-title">Tur Nəticələri</h2>
            <div id="scoreboard-list" style="margin: 20px 0; text-align: left;"></div>
            <button id="next-action-btn" onclick="nextRoundOrFinish()">Növbəti Tur</button>
        </div>
    </div>

    <script>
        let players = [];
        let currentRound = 1;
        let currentPlayerIndex = 0;
        let currentQuestionIndex = 0;
        let qPerPlayer = 2;
        let timer;
        let timeLeft = 25;
        let isReadingPhase = true;
        let fiftyFiftyUsed = false;
        let audienceUsed = false;

        const allQuestions = [
            { q: "Azərbaycan Demokratik Respublikası hansı ildə yaradılmışdır?", options: ["1918", "1920", "1991", "1936"], correct: 0 },
            { q: "Dünyanın ən böyük okeanı hansıdır?", options: ["Atlantik", "Hind", "Şaxtalı Buzlu", "Sakit"], correct: 3 },
            { q: "9-un kvadratı ədədi nəyə bərabərdir?", options: ["72", "81", "18", "99"], correct: 1 },
            { q: "Çempionlar Liqasını ən çox qazanan klub hansıdır?", options: ["Barcelona", "AC Milan", "Real Madrid", "Manchester United"], correct: 2 },
            { q: "Azərbaycanın ən uzun çayı hansıdır?", options: ["Kür", "Araz", "Samur", "Qanıx"], correct: 0 },
            { q: "Üçbucağın daxili bucaqlarının cəmi neçə dərəcədir?", options: ["90°", "180°", "360°", "270°"], correct: 1 },
            { q: "Şah İsmayıl Xatai hansı sülalənin banisidir?", options: ["Şirvanşahlar", "Səfəvilər", "Qacarlar", "Atabəylər"], correct: 1 },
            { q: "Xəzər dənizi coğrafi cəhətdən əslində nə hesab olunur?", options: ["Okean", "Açıq dəniz", "Dünyanın ən böyük gölü", "Körfəz"], correct: 2 }
        ];

        function goToSetup() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }

        function goHome() {
            clearInterval(timer);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }

        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if(name && !players.some(p => p.name === name)) {
                players.push({ name: name, score: 0, activeInTournament: true });
                input.value = '';
                renderPlayersList();
            }
        }

        function removePlayer(name) {
            players = players.filter(p => p.name !== name);
            renderPlayersList();
        }

        function renderPlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = players.map(p => `<div class="player-tag">${p.name} <span onclick="removePlayer('${p.name}')">✕</span></div>`).join('');
        }

        function startTournament() {
            if(players.length < 2) {
                alert("Ən azı 2 iştirakçı əlavə etməlisən!");
                return;
            }
            qPerPlayer = parseInt(document.getElementById('questions-per-player').value);
            currentRound = 1;
            fiftyFiftyUsed = false;
            audienceUsed = false;
            
            // Bütün oyunçuları aktiv et
            players.forEach(p => { p.score = 0; p.activeInTournament = true; });

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startRound();
        }

        function startRound() {
            currentPlayerIndex = 0;
            currentQuestionIndex = 0;
            loadTurn();
        }

        function loadTurn() {
            const activePlayers = players.filter(p => p.activeInTournament);
            if(currentPlayerIndex >= activePlayers.length) {
                showRoundResults();
                return;
            }

            const currentPlayer = activePlayers[currentPlayerIndex];
            document.getElementById('current-round-text').innerText = `Tur: ${currentRound} / 6`;
            document.getElementById('current-player-text').innerText = `Növbə: ${currentPlayer.name}`;
            
            document.getElementById('lifeline-50').disabled = fiftyFiftyUsed;
            document.getElementById('lifeline-audience').disabled = audienceUsed;

            isReadingPhase = true;
            timeLeft = 25; // 25 saniyəlik ümumi taymer
            document.getElementById('timer-text').innerText = `⏱️ ${timeLeft}s`;
            document.getElementById('question-box').innerText = `${currentPlayer.name}, sual oxunur (Hazırlaş)...`;
            
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => {
                b.style.display = 'block';
                b.style.opacity = '0.3';
                b.disabled = true;
                b.style.background = 'linear-gradient(135deg, #1e293b, #0f172a)';
            });
            document.getElementById('status-msg').innerText = "Sual səsləndirilir...";

            // 25 saniyəlik tək timer (İlk 5 san oxuma, sonrakı 20 san cavablandırma)
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = `⏱️ ${timeLeft}s`;

                if(timeLeft === 20) {
                    // Oxuma fazası bitdi, cavablandırma başladı
                    beginAnsweringPhase();
                }

                if(timeLeft <= 0) {
                    clearInterval(timer);
                    handleAnswer(-1); // Vaxt bitdi
                }
            }, 1000);
        }

        function beginAnsweringPhase() {
            isReadingPhase = false;
            window.currentQ = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            document.getElementById('question-box').innerText = window.currentQ.q;

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach((btn, idx) => {
                btn.style.opacity = '1';
                btn.disabled = false;
                btn.innerText = window.currentQ.options[idx];
            });
            document.getElementById('status-msg').innerText = "Cavabını seç!";
        }

        function checkAnswer(selectedIndex) {
            if(isReadingPhase) return;
            clearInterval(timer);
            handleAnswer(selectedIndex);
        }

        function handleAnswer(selectedIndex) {
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => b.disabled = true);

            const activePlayers = players.filter(p => p.activeInTournament);
            const currentPlayer = activePlayers[currentPlayerIndex];

            if(selectedIndex === window.currentQ.correct) {
                optionBtns[selectedIndex].style.background = '#10b981';
                currentPlayer.score += 10;
                document.getElementById('status-msg').innerText = "🎉 Düzdür! (+10 xal)";
                document.getElementById('status-msg').style.color = '#10b981';
            } else {
                if(selectedIndex !== -1) {
                    optionBtns[selectedIndex].style.background = '#ef4444';
                }
                optionBtns[window.currentQ.correct].style.background = '#10b981';
                document.getElementById('status-msg').innerText = "❌ Səhvdir / Vaxt bitdi! Turdan kənarlaşdırıldın.";
                document.getElementById('status-msg').style.color = '#ef4444';
                
                // Avtomatik turdan / yarışdan çıxarılır
                currentPlayer.activeInTournament = false;
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if(currentQuestionIndex < qPerPlayer && currentPlayer.activeInTournament) {
                    loadTurn();
                } else {
                    currentPlayerIndex++;
                    currentQuestionIndex = 0;
                    loadTurn();
                }
            }, 2500);
        }

        function useFiftyFifty() {
            if(fiftyFiftyUsed || isReadingPhase) return;
            fiftyFiftyUsed = true;
            document.getElementById('lifeline-50').disabled = true;

            const correct = window.currentQ.correct;
            let hiddenCount = 0;
            const optionBtns = document.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, idx) => {
                if(idx !== correct && hiddenCount < 2) {
                    btn.style.opacity = '0.1';
                    btn.disabled = true;
                    hiddenCount++;
                }
            });
        }

        function useAudience() {
            if(audienceUsed || isReadingPhase) return;
            audienceUsed = true;
            document.getElementById('lifeline-audience').disabled = true;

            const correct = window.currentQ.correct;
            alert(`📊 Auditoriyanın rəyi:\n${window.currentQ.options[correct]} variantına daha çox səs verdilər!`);
        }

        function showRoundResults() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const sorted = [...players].sort((a,b) => b.score - a.score);
            document.getElementById('result-title').innerText = `${currentRound}-ci Turun Nəticələri`;
            
            const list = document.getElementById('scoreboard-list');
            list.innerHTML = sorted.map((p, idx) => `
                <div style="padding: 10px 15px; background: #020617; border: 1px solid #1e293b; margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span>#${idx+1} ${p.name} ${!p.activeInTournament ? '<span style="color:#ef4444; font-size:0.8rem;">(Kənarlaşdırıldı)</span>' : ''}</span> 
                    <span style="color: #38bdf8; font-weight: bold;">${p.score} xal</span>
                </div>
            `).join('');

            const nextBtn = document.getElementById('next-action-btn');
            if(currentRound === 5) {
                nextBtn.innerText = "🏆 6-cı Tur (Böyük Finala Keç)";
            } else if(currentRound >= 6) {
                nextBtn.innerText = "🎯 Oyunu Bitir / Yenidən Başla";
            } else {
                nextBtn.innerText = "➡️ Növbəti Tura Keç";
            }
        }

        function nextRoundOrFinish() {
            if(currentRound >= 6) {
                goHome();
                return;
            }

            if(currentRound === 5) {
                players.sort((a,b) => b.score - a.score);
                if(players.length > 5) {
                    players = players.slice(0, 5);
                }
                alert("Möhtəşəm! Ən yaxşı oyunçular 6-cı tur Finalına vəsiqə qazandılar!");
            }

            // Növbəti tur üçün hamını yenidən aktivləşdiririk
            players.forEach(p => p.activeInTournament = true);

            currentRound++;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startRound();
        }
    </script>
</body>
</html>
