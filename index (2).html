<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azərbaycan Trivia Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 1. Əsas Menyu -->
        <div id="main-menu" class="screen">
            <h1>🎮 Trivia Oyunu</h1>
            <p id="high-score-display">🏆 Rekord: 0</p>
            <div class="menu-buttons">
                <button id="btn-singleplayer" class="menu-btn">👤 Solo Rejim</button>
                <button id="btn-multiplayer-menu" class="menu-btn">👥 Multiplayer Arena</button>
            </div>
        </div>

        <!-- 2. Kateqoriya Seçimi (Solo) -->
        <div id="category-screen" class="screen" style="display: none;">
            <h2>Kateqoriya Seçin</h2>
            <div class="categories-grid">
                <button class="cat-btn" data-category="Ümumi">🌐 Ümumi Sual</button>
                <button class="cat-btn" data-category="Tarix">📜 Tarix</button>
                <button class="cat-btn" data-category="Coğrafiya">🌍 Coğrafiya</button>
                <button class="cat-btn" data-category="Riyaziyyat">🔢 Riyaziyyat</button>
                <button class="cat-btn" data-category="Futbol">⚽ Futbol</button>
                <button class="cat-btn" data-category="İT">💻 İT & Texnologiya</button>
            </div>
            <button id="back-to-main" class="back-btn">Geri</button>
        </div>

        <!-- 3. Multiplayer Menyu və Lobby -->
        <div id="multiplayer-screen" class="screen" style="display: none;">
            <h2>👥 Multiplayer Otaqlar</h2>
            <div class="mp-inputs">
                <input type="text" id="player-name" placeholder="Adınızı daxil edin..." maxlength="15">
                <div class="mp-actions">
                    <button id="create-room-btn" class="mp-btn">Otaq Yarat</button>
                    <div class="join-box">
                        <input type="text" id="room-code-input" placeholder="Otaq Kodu" maxlength="6">
                        <button id="join-room-btn" class="mp-btn">Otağa Qoşul</button>
                    </div>
                </div>
            </div>

            <div id="room-lobby-box" style="display: none;" class="lobby-box">
                <h3>Otaq Kodu: <span id="display-room-code" style="color: #ffcc00;">----</span></h3>
                <p>Otaqdakı İştirakçılar:</p>
                <ul id="lobby-players-list"></ul>
                <button id="start-mp-game-btn" class="menu-btn" style="display: none; background: #4CAF50;">Oyunu Başlat</button>
            </div>

            <button id="back-to-menu-from-mp" class="back-btn">Geri</button>
        </div>

        <!-- 4. Oyun Ekranı -->
        <div id="game-screen" class="screen" style="display: none;">
            <div class="game-header">
                <span id="cat-title">📁 Kateqoriya</span>
                <span id="timer">⏱️ 20</span>
                <span id="score">Xal: 0</span>
            </div>

            <!-- Canlı Multiplayer Xal Cədvəli -->
            <div id="mp-scoreboard" style="display: none;" class="mp-scoreboard">
                <div id="mp-scores-list"></div>
            </div>

            <button id="lifeline-btn" class="lifeline-btn">⚡ 50/50 Kömək (2 səhvi sil)</button>

            <div class="question-container">
                <h2 id="question-text">Sual yüklənir...</h2>
            </div>

            <div class="options-grid">
                <button class="option-btn" data-index="0"><span class="opt-text">Cavab 1</span></button>
                <button class="option-btn" data-index="1"><span class="opt-text">Cavab 2</span></button>
                <button class="option-btn" data-index="2"><span class="opt-text">Cavab 3</span></button>
                <button class="option-btn" data-index="3"><span class="opt-text">Cavab 4</span></button>
            </div>

            <p id="status-message"></p>
            <button id="back-to-menu" class="back-btn" style="margin-top: 20px;">Menyuya Qayıt</button>
        </div>
    </div>

    <!-- Firebase SDK scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
